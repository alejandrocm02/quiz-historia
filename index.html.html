<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Historia & Cultura General</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0d;
    --surface: #1a1916;
    --surface2: #232220;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dim: rgba(201,168,76,0.12);
    --text: #f0ece4;
    --text-secondary: rgba(240,236,228,0.5);
    --success: #4a9e6b;
    --success-bg: rgba(74,158,107,0.12);
    --success-border: rgba(74,158,107,0.3);
    --danger: #c25454;
    --danger-bg: rgba(194,84,84,0.12);
    --danger-border: rgba(194,84,84,0.3);
    --radius: 14px;
    --radius-sm: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 2rem 1rem 4rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(ellipse, rgba(201,168,76,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 600px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeDown 0.6s ease both;
  }

  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    border: 0.5px solid rgba(201,168,76,0.35);
    padding: 5px 14px;
    border-radius: 99px;
    margin-bottom: 1rem;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 2.8rem);
    font-weight: 900;
    line-height: 1.1;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  h1 em {
    font-style: italic;
    color: var(--gold);
  }

  .subtitle {
    margin-top: 0.6rem;
    font-size: 14px;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }

  /* Meta bar */
  .meta-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
    animation: fadeUp 0.5s ease 0.2s both;
  }

  .meta-label {
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .score-pill {
    font-size: 12px;
    font-weight: 500;
    color: var(--gold);
    background: var(--gold-dim);
    border: 0.5px solid rgba(201,168,76,0.25);
    padding: 4px 12px;
    border-radius: 99px;
  }

  /* Progress */
  .progress-track {
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 99px;
    margin-bottom: 1.25rem;
    overflow: hidden;
    animation: fadeUp 0.5s ease 0.25s both;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Question card */
  .question-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem 1.5rem;
    margin-bottom: 1rem;
    min-height: 100px;
    display: flex;
    align-items: center;
    animation: fadeUp 0.45s ease 0.3s both;
    position: relative;
    overflow: hidden;
  }

  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.3), transparent);
  }

  .q-number {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 900;
    color: rgba(201,168,76,0.15);
    line-height: 1;
    margin-right: 1rem;
    flex-shrink: 0;
    user-select: none;
  }

  .q-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 400;
    color: var(--text);
    line-height: 1.5;
  }

  /* Answers grid */
  .answers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 1rem;
    animation: fadeUp 0.45s ease 0.38s both;
  }

  .answer-btn {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    line-height: 1.45;
    min-height: 72px;
    display: flex;
    align-items: center;
    transition: background 0.18s, border-color 0.18s, transform 0.12s;
    position: relative;
    overflow: hidden;
  }

  .answer-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0);
    transition: background 0.18s;
  }

  .answer-btn:hover:not(:disabled) {
    background: var(--surface2);
    border-color: var(--border-hover);
  }

  .answer-btn:active:not(:disabled) {
    transform: scale(0.98);
  }

  .answer-btn.correct {
    background: var(--success-bg);
    border-color: var(--success-border);
    color: #6ecf95;
  }

  .answer-btn.wrong {
    background: var(--danger-bg);
    border-color: var(--danger-border);
    color: #e07777;
  }

  .answer-btn.reveal {
    background: var(--success-bg);
    border-color: var(--success-border);
    color: #6ecf95;
  }

  .answer-btn:disabled { cursor: default; }

  /* Feedback */
  .feedback {
    font-size: 13.5px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 0.5px solid;
    margin-bottom: 1rem;
    display: none;
    animation: fadeUp 0.3s ease both;
    line-height: 1.5;
  }

  .feedback.correct {
    background: var(--success-bg);
    border-color: var(--success-border);
    color: #6ecf95;
    display: block;
  }

  .feedback.wrong {
    background: var(--danger-bg);
    border-color: var(--danger-border);
    color: #e07777;
    display: block;
  }

  /* Next button */
  .next-btn {
    width: 100%;
    padding: 13px;
    background: transparent;
    border: 0.5px solid rgba(201,168,76,0.4);
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--gold);
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 0.18s, border-color 0.18s;
    display: none;
    animation: fadeUp 0.3s ease both;
  }

  .next-btn:hover {
    background: var(--gold-dim);
    border-color: rgba(201,168,76,0.6);
  }

  /* Results */
  .results {
    text-align: center;
    padding: 3rem 1rem 2rem;
    animation: fadeUp 0.6s ease both;
  }

  .results-fraction {
    font-family: 'Playfair Display', serif;
    font-size: 72px;
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .results-total {
    font-size: 32px;
    color: var(--text-secondary);
  }

  .results-pct {
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 6px;
    margin-bottom: 1.5rem;
  }

  .results-msg {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-style: italic;
    color: var(--text);
    line-height: 1.6;
    max-width: 380px;
    margin: 0 auto 2rem;
    opacity: 0.85;
  }

  .stars {
    font-size: 28px;
    letter-spacing: 4px;
    margin-bottom: 1.5rem;
  }

  .restart-btn {
    padding: 12px 32px;
    background: transparent;
    border: 0.5px solid rgba(201,168,76,0.4);
    border-radius: 99px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--gold);
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: background 0.18s, border-color 0.18s;
  }

  .restart-btn:hover {
    background: var(--gold-dim);
    border-color: rgba(201,168,76,0.6);
  }

  /* Divider */
  .divider {
    width: 40px;
    height: 1px;
    background: rgba(201,168,76,0.3);
    margin: 1.5rem auto;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .answers-grid { grid-template-columns: 1fr; }
    .answer-btn { min-height: 56px; }
    h1 { font-size: 1.9rem; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="tag">Quiz cultural</div>
    <h1>Historia &amp; <em>Cultura</em><br>General</h1>
    <p class="subtitle">10 preguntas · ¿Cuántas aciertas?</p>
  </header>

  <div id="quiz-content"></div>
</div>

<script>
const questions = [
  { q: "¿Cuándo acabó la II Guerra Mundial?", correct: "En 1945", wrong: ["En 1939", "En 1918", "En 1950"] },
  { q: "¿Cuál era el apellido de la reina Isabel II de Inglaterra?", correct: "Windsor", wrong: ["Tudor", "Hannover", "Plantagenet"] },
  { q: "¿En qué año se aprobó la actual Constitución española?", correct: "En 1978", wrong: ["En 1931", "En 1969", "En 1982"] },
  { q: "¿Qué día es la fiesta de la Hispanidad?", correct: "El 12 de octubre", wrong: ["El 6 de diciembre", "El 23 de abril", "El 1 de mayo"] },
  { q: "¿Cuál fue el primer presidente democrático de España tras la dictadura franquista?", correct: "Adolfo Suárez", wrong: ["Felipe González", "Leopoldo Calvo-Sotelo", "Manuel Fraga"] },
  { q: "¿En qué año murió Freddie Mercury?", correct: "En 1991", wrong: ["En 1984", "En 1997", "En 2001"] },
  { q: "¿Qué día es la fiesta nacional de Estados Unidos?", correct: "El 4 de julio", wrong: ["El 4 de noviembre", "El 14 de julio", "El 1 de enero"] },
  { q: "¿Quién inventó la bombilla?", correct: "Thomas Edison", wrong: ["Nikola Tesla", "Alexander Graham Bell", "Benjamin Franklin"] },
  { q: "¿En qué país se usó la primera bomba atómica?", correct: "En Japón (Hiroshima)", wrong: ["En Alemania", "En Corea", "En China"] },
  { q: "¿Cuándo empezó la Primera Guerra Mundial?", correct: "En 1914", wrong: ["En 1905", "En 1918", "En 1939"] }
];

let current = 0, score = 0, answered = false, shuffledAnswers = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function escQ(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function render() {
  const wrap = document.getElementById('quiz-content');
  if (current >= questions.length) { renderResults(wrap); return; }
  const q = questions[current];
  shuffledAnswers = shuffle([q.correct, ...q.wrong]);
  answered = false;
  const pct = (current / questions.length) * 100;
  wrap.innerHTML = `
    <div class="meta-bar">
      <span class="meta-label">Pregunta ${current + 1} <span style="opacity:.4">/ ${questions.length}</span></span>
      <span class="score-pill">✦ ${score} aciertos</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" style="width:${pct}%"></div>
    </div>
    <div class="question-card">
      <span class="q-number">0${current + 1}</span>
      <p class="q-text">${q.q}</p>
    </div>
    <div class="answers-grid" id="answers-grid">
      ${shuffledAnswers.map((a, i) => `
        <button class="answer-btn" id="btn-${i}" onclick="handleAnswer(this,'${escQ(a)}')">${a}</button>
      `).join('')}
    </div>
    <div id="feedback" class="feedback"></div>
    <button id="next-btn" class="next-btn" onclick="nextQ()">
      ${current + 1 < questions.length ? 'Siguiente pregunta →' : 'Ver resultados →'}
    </button>
  `;
}

function handleAnswer(btn, selected) {
  if (answered) return;
  answered = true;
  const correct = questions[current].correct;
  const isCorrect = selected === correct;
  if (isCorrect) score++;
  document.querySelectorAll('.answer-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent.trim() === correct) b.classList.add('reveal');
  });
  if (!isCorrect) { btn.classList.remove('reveal'); btn.classList.add('wrong'); }
  else { btn.classList.remove('reveal'); btn.classList.add('correct'); }
  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
  fb.textContent = isCorrect ? '✓ ¡Correcto! Bien hecho.' : `✕ Incorrecto. La respuesta era: ${correct}`;
  document.getElementById('next-btn').style.display = 'block';
}

function nextQ() { current++; render(); }

function renderResults(wrap) {
  const pct = Math.round((score / questions.length) * 100);
  let msg, stars;
  if (pct === 100) { msg = "Impecable. Dominas la historia y la cultura con maestría absoluta."; stars = "★★★★★"; }
  else if (pct >= 80) { msg = "Excelente resultado. Tu conocimiento histórico y cultural es admirable."; stars = "★★★★☆"; }
  else if (pct >= 60) { msg = "Buen nivel. Tienes una sólida base cultural con algo de margen para crecer."; stars = "★★★☆☆"; }
  else if (pct >= 40) { msg = "No está mal, pero hay varias cosas por repasar. ¡La cultura general se entrena!"; stars = "★★☆☆☆"; }
  else { msg = "Parece que la historia guarda aún muchos secretos para ti. ¡Ánimo y a estudiar!"; stars = "★☆☆☆☆"; }
  wrap.innerHTML = `
    <div class="results">
      <div class="stars">${stars}</div>
      <div class="results-fraction">${score}<span class="results-total">/${questions.length}</span></div>
      <div class="results-pct">${pct}% de aciertos</div>
      <div class="divider"></div>
      <p class="results-msg">${msg}</p>
      <button class="restart-btn" onclick="restartQuiz()">Volver a empezar</button>
    </div>
  `;
}

function restartQuiz() { current = 0; score = 0; render(); }

render();
</script>
</body>
</html>
